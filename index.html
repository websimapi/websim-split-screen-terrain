<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Split Screen Terrain</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; touch-action: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }
        .split-divider {
            position: absolute;
            background: #fff;
            opacity: 0.2;
            pointer-events: none;
        }
        /* Touch controls container */
        #touch-controls {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .zone {
            position: absolute;
            pointer-events: auto;
            /* Debug helper: background: rgba(255,0,0,0.1); */
        }
        /* Initial overlay */
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #87CEEB, #e0f7fa);
            color: #4a4a4a;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: 'Verdana', sans-serif;
            z-index: 20;
            pointer-events: auto;
            text-align: center;
        }
        h1 { 
            margin: 0 0 20px 0; 
            letter-spacing: 2px; 
            color: #2e7d32;
            text-shadow: 1px 1px 0px #fff;
            font-size: 3rem;
        }
        .controls-info { display: flex; gap: 40px; margin-bottom: 30px; }
        .p-card { 
            border: 4px solid #fff; 
            padding: 20px; 
            border-radius: 15px; 
            background: rgba(255,255,255,0.8);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .key { display: inline-block; padding: 4px 8px; border: 1px solid #666; border-radius: 4px; color: #555; margin: 2px; background: #fff; }
        button {
            padding: 15px 40px;
            background: #ffa000;
            color: white;
            border: 4px solid #fff;
            border-radius: 30px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://esm.sh/three@0.160.0",
            "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/",
            "nipplejs": "https://esm.sh/nipplejs@0.10.1",
            "simplex-noise": "https://esm.sh/simplex-noise@4.0.1"
        }
    }
    </script>
</head>
<body>
    <div id="start-overlay">
        <h1>Farm Friends</h1>
        <div class="controls-info">
            <div class="p-card" style="border-bottom: 5px solid #ff7777;">
                <h3 style="color: #d32f2f;">Farmer Red</h3>
                <div>WASD</div>
                <div>Left Stick</div>
            </div>
            <div class="p-card" style="border-bottom: 5px solid #7777ff;">
                <h3 style="color: #1976d2;">Farmer Blue</h3>
                <div>YGHJ</div>
                <div>Right Stick</div>
            </div>
        </div>
        <button id="start-btn">Start Farming</button>
    </div>

    <div id="ui-layer">
        <div id="divider" class="split-divider"></div>
    </div>
    <div id="touch-controls">
        <div id="zone-p1" class="zone"></div>
        <div id="zone-p2" class="zone"></div>
    </div>

    <script type="module" src="./main.js"></script>

</body>
</html>
