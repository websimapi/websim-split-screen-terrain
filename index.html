<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Split Screen Terrain</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; touch-action: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; position: absolute; top: 0; left: 0; }
        
        #lobby-ui {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            text-align: center;
        }
        #qr-container {
            background: white;
            padding: 10px;
            border-radius: 10px;
            margin: 10px;
        }
        #qr-container canvas {
            position: relative !important; /* Override absolute */
        }
        .player-list {
            display: flex;
            gap: 10px;
            margin: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .player-badge {
            background: #fff;
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .mode-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 100;
            background: rgba(0,0,0,0.5);
            color: white;
            border: 1px solid white;
            padding: 8px;
            border-radius: 8px;
            pointer-events: auto;
            cursor: pointer;
            display: none; /* Hidden by default, shown on client */
        }
        
        /* P5 Diamond Canvas */
        #c-p5 {
            pointer-events: none;
            z-index: 5;
            display: none;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            /* Center it */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px; /* Default size, set by JS */
            height: 300px;
            box-sizing: border-box;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }
        .split-divider {
            position: absolute;
            background: #fff;
            opacity: 0.4;
            pointer-events: none;
            z-index: 4;
        }
        /* Touch controls container */
        #touch-controls {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .zone {
            position: absolute;
            pointer-events: auto;
            /* Debug helper: background: rgba(255,0,0,0.1); */
        }
        /* Initial overlay */
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #87CEEB, #e0f7fa);
            color: #4a4a4a;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: 'Verdana', sans-serif;
            z-index: 20;
            pointer-events: auto;
            text-align: center;
        }
        h1 { 
            margin: 0 0 20px 0; 
            letter-spacing: 2px; 
            color: #2e7d32;
            text-shadow: 1px 1px 0px #fff;
            font-size: 3rem;
        }
        .controls-info { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center;}
        .p-card { 
            border: 4px solid #fff; 
            padding: 15px; 
            border-radius: 15px; 
            background: rgba(255,255,255,0.8);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            min-width: 100px;
        }
        .key { display: inline-block; padding: 4px 8px; border: 1px solid #666; border-radius: 4px; color: #555; margin: 2px; background: #fff; }
        
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        button {
            padding: 15px 30px;
            background: #ffa000;
            color: white;
            border: 4px solid #fff;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.1s, background 0.2s;
        }
        button:hover { background: #ffb300; }
        button:active { transform: scale(0.95); }
        button.selected { background: #e65100; border-color: #ffe0b2; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://esm.sh/three@0.160.0",
            "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/",
            "nipplejs": "https://esm.sh/nipplejs@0.10.1",
            "simplex-noise": "https://esm.sh/simplex-noise@4.0.1",
            "peerjs": "https://esm.sh/peerjs@1.5.2",
            "qrcode": "https://esm.sh/qrcode@1.5.3"
        }
    }
    </script>
</head>
<body>
    <div id="start-overlay">
        <h1>Farm Friends</h1>
        
        <!-- Main Menu -->
        <div id="main-menu">
            <button id="btn-host">Host Game</button>
            <br><br>
            <p>-- OR --</p>
            <br>
            <div id="join-status">Scan Host QR Code to Join</div>
        </div>

        <!-- Host Lobby -->
        <div id="lobby-ui">
            <h3>Lobby</h3>
            <div id="qr-container"></div>
            <p>Scan to Join</p>
            <div class="player-list" id="lobby-players">
                <div class="player-badge" style="border-bottom: 4px solid #ff4444">P1 (Host)</div>
            </div>
            <button id="btn-start-game">Start Game</button>
        </div>
        
        <!-- Client Waiting -->
        <div id="client-wait" style="display:none;">
            <h2>Connected!</h2>
            <p>Waiting for host to start...</p>
            <div class="player-badge" id="my-player-badge">...</div>
        </div>

    </div>

    <button id="view-toggle" class="mode-toggle">Switch to Controller Mode</button>

    <!-- Main canvas for P1-P4 -->
    <!-- Created by ThreeJS logic usually, but we want strict control if we have 2 canvases -->
    <!-- To keep main.js simple, we let it append main canvas, and we manually add P5 canvas here -->
    
    <canvas id="c-p5"></canvas>

    <div id="ui-layer">
        <!-- Dividers will be generated by JS or we can reuse this one for 2P -->
        <div id="divider-v" class="split-divider"></div>
        <div id="divider-h" class="split-divider"></div>
    </div>
    <div id="touch-controls">
        <div id="zone-p1" class="zone"></div>
        <div id="zone-p2" class="zone"></div>
    </div>

    <script type="module" src="./main.js"></script>

</body>
</html>
